name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-python:
    name: Test & Build Python Rules Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Package & Test Dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Python Rule Pytest Suite
        working-directory: python
        run: |
          pytest --junitxml=../test-results-python.xml

      - name: Test semgrep-python CLI Entrypoint
        run: |
          semgrep-python --version
          semgrep-python --help

      - name: Build Python Distribution (Wheel & Sdist)
        run: |
          python -m pip install build
          python -m build python/ -o dist/python

      - name: Upload Python Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/python/

  test-csharp:
    name: Test & Build C# NuGet Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python (for semgrep rule testing)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Semgrep & Pytest
        run: |
          python -m pip install --upgrade pip
          pip install semgrep pytest pyyaml

      - name: Run C# Rule Tests
        working-directory: csharp
        run: |
          pytest tests/ --junitxml=../test-results-csharp.xml

      - name: Build C# NuGet Package
        run: |
          dotnet pack csharp/Thruput.Semgrep.Rules.csproj -c Release -o dist/nuget

      - name: Upload NuGet Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: dist/nuget/
