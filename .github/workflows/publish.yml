name: Publish Packages

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  publish-python:
    name: Publish Python Package (GitHub Release Assets & PyPI)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python Package
        run: |
          python -m pip install --upgrade pip build
          python -m build python/ -o dist/python

      - name: Upload Python Package to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} dist/python/* --clobber

      # Publish to PyPI (optional: if PYPI_API_TOKEN secret is configured)
      - name: Publish to PyPI
        if: env.PYPI_API_TOKEN != ''
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python/

  publish-nuget:
    name: Publish C# NuGet Package (GitHub Packages & NuGet.org)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build NuGet Package
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          if [ -n "$VERSION" ]; then
            dotnet pack csharp/Thruput.Semgrep.Rules.csproj -c Release -p:Version="$VERSION" -o dist/nuget
          else
            dotnet pack csharp/Thruput.Semgrep.Rules.csproj -c Release -o dist/nuget
          fi

      - name: Upload NuGet Package to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.event.release.tag_name }} dist/nuget/* --clobber

      # Register GitHub Packages as authenticated NuGet source
      - name: Authenticate GitHub Packages NuGet Source
        run: |
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --name "github" \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text

      # Push to GitHub Packages NuGet Feed
      - name: Push to GitHub Packages
        run: |
          dotnet nuget push dist/nuget/*.nupkg \
            --source "github" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --skip-duplicate

      # Authenticate with NuGet.org via OIDC (Trusted Publishing)
      - name: Authenticate with NuGet.org
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ vars.NUGET_USERNAME || secrets.NUGET_USERNAME }}

      # Push to NuGet.org
      - name: Push to NuGet.org
        run: |
          dotnet nuget push dist/nuget/*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }} \
            --skip-duplicate
