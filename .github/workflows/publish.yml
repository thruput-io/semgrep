name: Publish Packages

on:
  release:
    types: [ published ]
  workflow_dispatch:

jobs:
  publish-python:
    name: Publish Python Package (PyPI / GitHub Packages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python Package
        run: |
          python -m pip install --upgrade pip build
          python -m build python/ -o dist/python

      - name: Publish to PyPI
        if: env.PYPI_API_TOKEN != ''
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/python/

  publish-nuget:
    name: Publish C# NuGet Package (NuGet.org / GitHub Packages)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build NuGet Package
        run: dotnet pack csharp/Thruput.Semgrep.Rules.csproj -c Release -o dist/nuget

      - name: Push to GitHub Packages
        run: |
          dotnet nuget push dist/nuget/*.nupkg \
            --source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      - name: Push to NuGet.org
        if: env.NUGET_API_KEY != ''
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push dist/nuget/*.nupkg \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --skip-duplicate
