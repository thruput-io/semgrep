rules:
- id: linear-deterministic-code
  message: Do not write tests that contain branching logic (if, switch, ternary) or loops (for, while). Split conditional
    scenarios into separate linear test cases.
  severity: ERROR
  languages:
  - javascript
  - typescript
  patterns:
  - pattern-either:
    - pattern: "if ($COND) {\n  ...\n}\n"
    - pattern: "for ($INIT; $COND; $STEP) {\n  ...\n}\n"
    - pattern: "for ($ITEM of $SEQ) {\n  ...\n}\n"
    - pattern: "while ($COND) {\n  ...\n}\n"
    - pattern: "switch ($EXPR) {\n  case $VAL:\n    ...\n}\n"
    - pattern: '$COND ? $THEN : $ELSE'
  - pattern-inside: "$TEST_FN($NAME, (...) => {\n  ...\n})\n"
  - metavariable-regex:
      metavariable: $TEST_FN
      regex: ^(test|it)$
  metadata:
    category: testing
    technology:
    - javascript
    references:
    - https://thruput.se/agents/#linear-deterministic-code
    - https://thruput.se/agents/#fail-fast
    rule: Linear deterministic code
    solutions:
    - 'SHOULD: Make processes safe to kill at any moment, so a crash costs nothing but a restart ([The Twelve-Factor App,
      IX. Disposability](https://12factor.net/disposability)).'
    - 'SHOULD: Leave recovery to a supervisor outside the failing process.'
