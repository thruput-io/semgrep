rules:
- id: no-default-on-failure
  message: Do not return or coalesce to a default value when failing. Fail fast instead of masking missing or failed values.
  severity: ERROR
  languages:
  - javascript
  - typescript
  patterns:
  - pattern-either:
    - pattern: $EXPR ?? $DEFAULT
    - pattern: $EXPR ??= $DEFAULT
    - pattern: "try {\n  ...\n} catch ($ERR) {\n  ...\n  return $DEFAULT;\n}\n"
    - pattern: "try {\n  ...\n} catch {\n  ...\n  return $DEFAULT;\n}\n"
  metadata:
    category: behavior-and-failure-handling
    technology:
    - javascript
    references:
    - https://thruput.se/agents/#no-default-on-failure
    - https://thruput.se/agents/#fail-fast
    rule: No default on failure
    solutions:
    - 'SHOULD: Make processes safe to kill at any moment, so a crash costs nothing but a restart ([The Twelve-Factor App,
      IX. Disposability](https://12factor.net/disposability)).'
    - 'SHOULD: Leave recovery to a supervisor outside the failing process.'
