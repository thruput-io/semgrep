rules:
- id: no-discarded-diagnostics
  message: 'Do not discard a child process''s error output (stdio: ''ignore'' or 2>/dev/null); let the failing tool report
    its error.'
  severity: ERROR
  languages:
  - javascript
  - typescript
  patterns:
  - pattern-either:
    - pattern: '{ ..., stdio: ''ignore'', ... }'
    - pattern: '{ ..., stdio: [$IN, $OUT, ''ignore''], ... }'
    - pattern-regex: '[''"`][^''"`\n]*(?:2>>?\s*/dev/null|&>>?\s*/dev/null)[^''"`\n]*[''"`]'
  metadata:
    category: behavior-and-failure-handling
    technology:
    - javascript
    references:
    - https://thruput.se/agents/#no-discarded-diagnostics
    - https://thruput.se/agents/#fail-fast
    rule: No discarded diagnostics
    solutions:
    - 'SHOULD: Make processes safe to kill at any moment, so a crash costs nothing but a restart ([The Twelve-Factor App,
      IX. Disposability](https://12factor.net/disposability)).'
    - 'SHOULD: Leave recovery to a supervisor outside the failing process.'
