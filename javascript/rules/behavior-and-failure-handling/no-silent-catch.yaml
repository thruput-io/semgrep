rules:
- id: no-silent-catch
  message: Do not use try/catch blocks or Promise .catch() handlers that do not rethrow.
  severity: ERROR
  languages:
  - javascript
  - typescript
  patterns:
  - pattern-either:
    - patterns:
      - pattern: "try {\n  ...\n} catch ($ERR) {\n  ...\n}\n"
      - pattern-not: "try {\n  ...\n} catch ($ERR) {\n  ...\n  throw $EX;\n}\n"
    - patterns:
      - pattern: "try {\n  ...\n} catch {\n  ...\n}\n"
      - pattern-not: "try {\n  ...\n} catch {\n  ...\n  throw $EX;\n}\n"
    - pattern: $PROMISE.catch(() => {})
    - pattern: $PROMISE.catch(($ERR) => {})
  metadata:
    category: behavior-and-failure-handling
    technology:
    - javascript
    references:
    - https://thruput.se/agents/#no-silent-catch
    - https://thruput.se/agents/#fail-fast
    rule: No silent catch
    solutions:
    - 'SHOULD: Make processes safe to kill at any moment, so a crash costs nothing but a restart ([The Twelve-Factor App,
      IX. Disposability](https://12factor.net/disposability)).'
    - 'SHOULD: Leave recovery to a supervisor outside the failing process.'
