rules:
- id: no-mutators
  message: Do not expose a setter or mutate an object in place. Return a new instance that passes the validating path of creation.
  severity: ERROR
  languages:
  - javascript
  - typescript
  patterns:
  - pattern-either:
    - pattern-regex: ^[ \t]*set\s+[A-Za-z0-9_$]+\s*\([^)]*\)\s*\{
    - patterns:
      - pattern-either:
        - pattern: $OBJ.$PROP = $VAL
        - pattern: $OBJ.$PROP += $VAL
        - pattern: $OBJ[$KEY] = $VAL
      - pattern-not-inside: "constructor(...) {\n  ...\n}\n"
      - metavariable-pattern:
          metavariable: $OBJ
          patterns:
          - pattern-not: module
          - pattern-not: exports
          - pattern-not: process.env
    - patterns:
      - pattern: Object.assign($TARGET, ...)
      - pattern-not: Object.assign({}, ...)
  metadata:
    category: domain-modeling
    technology:
    - javascript
    references:
    - https://thruput.se/agents/#no-mutators
    - https://thruput.se/agents/#immutable-by-default
    rule: No mutators
    solutions:
    - 'SHOULD: Use every typing add-on the language offers to give every type one [[Validating path of creation]] and no other.'
    - 'SHOULD: Where code smells of [[Optionality]] and [[Primitive Obsession]], improve it first by introducing encapsulation:
      refactor to opaque types, and retire the tests that only guarded against values the types can no longer hold.'
