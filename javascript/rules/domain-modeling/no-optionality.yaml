rules:
- id: no-optionality
  message: Do not use optional parameters, default parameter values, or return undefined as an in-band sentinel. Provide explicit
    methods or typed outcomes instead.
  severity: ERROR
  languages:
  - javascript
  - typescript
  patterns:
  - pattern-either:
    - pattern: return undefined;
    - pattern-regex: \bfunction\s+[A-Za-z0-9_$]*\s*\([^)]*=[^)>][^)]*\)
    - pattern-regex: \([A-Za-z0-9_$,\s]*[A-Za-z0-9_$]+\s*=\s*[^)>]+\)\s*=>
  metadata:
    category: domain-modeling
    technology:
    - javascript
    references:
    - https://thruput.se/agents/#no-optionality
    - https://thruput.se/agents/#avoid-optionality
    rule: No optionality
    solutions:
    - 'SHOULD: Make the toggle a strategy so that it encodes all options it controls'
    - 'SHOULD: Make overload or specific behaviour [[Explicitly named method]]s instead of optional flags'
