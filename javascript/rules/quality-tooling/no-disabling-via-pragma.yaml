rules:
  - id: no-disabling-via-pragma
    message: "Do not disable linting or type-checking rules locally via comments or pragmas (eslint-disable, @ts-ignore, @ts-expect-error, @ts-nocheck, biome-ignore, nosemgrep)."
    severity: ERROR
    languages:
      - javascript
      - typescript
    patterns:
      - pattern-regex: '(?:\/\/|\/\*)[ \t]*(?:eslint-disable(?:-next-line|-line)?|@ts-(?:ignore|expect-error|nocheck)|biome-ignore|prettier-ignore|nosemgrep)\b'
    metadata:
      category: quality-tooling
      technology:
        - javascript
      references:
        - https://thruput.se/agents/#push-tests-down-the-pyramid
        - https://github.com/thruput-io/agents/blob/main/rules/Rules.yaml
