rules:
- id: no-committing-generated-code
  message: Do not commit generated code or source map artifacts to version control.
  severity: ERROR
  languages:
  - javascript
  - typescript
  patterns:
  - pattern-regex: (?:\/\/|\/\*)[# \t*@]*(?:@generated\b|AUTO-GENERATED|DO NOT EDIT\b|sourceMappingURL=)
  metadata:
    category: quality-tooling
    technology:
    - javascript
    references:
    - https://thruput.se/agents/#no-committing-generated-code
    - https://thruput.se/agents/#the-toolchain-is-the-guardrail
    rule: No committing generated code
    solutions:
    - 'SHOULD: Run the same build locally and in the pipeline, so a change meets one bar wherever it runs.'
    - 'SHOULD: Resolve a [[Static code analysis]] warning at its root cause; where the code cannot satisfy a strict rule,
      seek architectural guidance, never a workaround.'
