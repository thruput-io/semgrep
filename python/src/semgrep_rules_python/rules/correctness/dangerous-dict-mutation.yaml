rules:
  - id: python-dangerous-iteration-mutation
    patterns:
      - pattern-either:
          - pattern: |
              for $KEY in $OBJ:
                  ...
                  del $OBJ[$KEY]
          - pattern: |
              for $KEY in $OBJ.keys():
                  ...
                  del $OBJ[$KEY]
          - pattern: |
              for $ITEM in $OBJ:
                  ...
                  $OBJ.remove($ITEM)
          - pattern: |
              for $ITEM in $OBJ:
                  ...
                  $OBJ.pop($KEY)
    message: >-
      Mutating `$OBJ` (via delete, remove, or pop) while iterating directly over it will cause a
      `RuntimeError: dictionary changed size during iteration` or silently skip elements in lists.
      Iterate over a copy instead (e.g. `list($OBJ.keys())` or `list($OBJ)`).
    languages: [python]
    severity: ERROR
    metadata:
      category: correctness
      confidence: MEDIUM
