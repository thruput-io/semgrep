rules:
- id: python-no-branching-or-loops-in-tests
  patterns:
  - pattern-either:
    - pattern: "if ...:\n    ...\n"
    - pattern: "for ... in ...:\n    ...\n"
    - pattern: "while ...:\n    ...\n"
    - pattern: "try:\n    ...\nexcept ...:\n    ...\n"
  - pattern-inside: "def $FUNC(...):\n    ...\n"
  - metavariable-regex:
      metavariable: $FUNC
      regex: ^test_.*
  message: Found branching or loop statement inside test function `$FUNC`. Per RULES.md Section 8, tests MUST be linear and
    deterministic. Tests MUST NOT contain branching logic (`if`, `switch`), fallback branches, or loops. Split conditional
    scenarios into separate parameterized unit tests.
  languages:
  - python
  severity: ERROR
  metadata:
    category: testing
    confidence: HIGH
    references:
    - https://thruput.se/agents/#linear-deterministic-code
    rule: Linear deterministic code
    solutions:
    - 'SHOULD: Make processes safe to kill at any moment, so a crash costs nothing but a restart ([The Twelve-Factor App,
      IX. Disposability](https://12factor.net/disposability)).'
    - 'SHOULD: Leave recovery to a supervisor outside the failing process.'
