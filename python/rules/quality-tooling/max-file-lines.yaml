rules:
  - id: python-max-file-lines
    message: >-
      File exceeds the maximum limit of 200 lines.
      Keep files small, modular, and focused on a single responsibility to maintain readability and maintainability.
    severity: ERROR
    languages:
      - python
    paths:
      exclude:
        - "tests/**"
        - "**/tests/**"
        - "test/**"
        - "**/test/**"
        - "*_test.py"
        - "test_*.py"
        - "conftest.py"
        - "**/conftest.py"
    patterns:
      - pattern-regex: '\A(?:[^\n]*\n){200}\K(?:\r?\n|.)[^\n]*'
    metadata:
      category: quality-tooling
      technology:
        - python
