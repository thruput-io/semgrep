rules:
  - id: python-sql-string-formatting
    patterns:
      - pattern-either:
          - pattern: '$CURSOR.execute(f"...", ...)'
          - pattern: '$CURSOR.execute("..." % (...), ...)'
          - pattern: '$CURSOR.execute("...".format(...), ...)'
          - pattern: '$CURSOR.execute("..." + ..., ...)'
    message: >-
      Detected dynamically constructed SQL query passed to `$CURSOR.execute(...)`.
      Using string interpolation, `.format()`, `%`, or string concatenation for SQL queries can lead to SQL Injection.
      Use parameterized queries instead (e.g. `$CURSOR.execute("SELECT * FROM users WHERE id = %s", (user_id,))`).
    languages: [python]
    severity: ERROR
    metadata:
      category: quality-tooling
      cwe: "CWE-89: Improper Neutralization of Special Elements used in an SQL Command ('SQL Injection')"
      confidence: HIGH
      references:
        - https://github.com/thruput-io/agents/blob/main/RULES.md#shift-left
