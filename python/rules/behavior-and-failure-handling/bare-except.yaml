rules:
- id: python-bare-except
  patterns:
  - pattern: "try:\n    ...\nexcept:\n    ...\n"
  message: Found bare `except:` block. A bare `except:` catches `BaseException`, which silently traps critical system signals
    such as `KeyboardInterrupt` and `SystemExit`. Catch specific exceptions (e.g. `except Exception:`, `except ValueError:`)
    instead.
  languages:
  - python
  severity: ERROR
  metadata:
    category: behavior-and-failure-handling
    confidence: HIGH
    references:
    - https://thruput.se/agents/#no-silent-catch
    - https://peps.python.org/pep-0008/#programming-recommendations
    rule: No silent catch
    solutions:
    - 'SHOULD: Make processes safe to kill at any moment, so a crash costs nothing but a restart ([The Twelve-Factor App,
      IX. Disposability](https://12factor.net/disposability)).'
    - 'SHOULD: Leave recovery to a supervisor outside the failing process.'
