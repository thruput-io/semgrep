rules:
  - id: python-avoid-passing-none-literal
    patterns:
      - pattern-either:
          - pattern: $FUNC(..., None, ...)
          - pattern: $FUNC(..., $KEY=None, ...)
      - metavariable-regex:
          metavariable: $FUNC
          regex: '^(?!.*(\bgetattr\b|\bsetattr\b|\bget\b|\bpop\b|\bnext\b|assert)).*$'
    message: >-
      Passing literal `None` as an argument to `$FUNC`.
      In Clean Code, avoid passing `None` as arguments.
      Rely on default argument values in function definitions (omit the argument at call site)
      or use dedicated, intention-revealing function overloads.
    languages: [python]
    severity: WARNING
    metadata:
      category: style
      confidence: MEDIUM
      references:
        - https://peps.python.org/pep-0008/#programming-recommendations
