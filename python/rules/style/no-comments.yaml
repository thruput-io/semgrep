rules:
  - id: python-no-comments
    patterns:
      - pattern-regex: '^[ \t]*#(?!([ \t]*(?:type:\s*ignore|noqa|pragma:|!|ruleid:|ok:|semgrep:)))[ \t]*\S.+$'
    message: >-
      Comments are disallowed in this codebase. Code should be self-documenting through clear naming,
      concise function structure, and type annotations.
    languages: [python]
    severity: ERROR
    metadata:
      category: style
      confidence: HIGH
