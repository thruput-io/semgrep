rules:
  - id: python-subprocess-shell-true
    patterns:
      - pattern: subprocess.$METHOD(..., shell=True, ...)
      - pattern-not: subprocess.$METHOD("...", shell=True)
      - pattern-not: subprocess.$METHOD(["...", ...], ...)
      - pattern-not: subprocess.$METHOD(("...", ...), ...)
    message: >-
      Found `subprocess` call with `shell=True` using dynamic command.
      This is vulnerable to shell injection if the command contains untrusted user input.
      Pass arguments as a list with `shell=False` (e.g. `subprocess.run(["cmd", arg1, arg2])`).
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      confidence: HIGH
