rules:
  - id: python-subprocess-shell-true
    patterns:
      - pattern-either:
          - pattern: "subprocess.Popen($CMD, ..., shell=True, ...)"
          - pattern: "subprocess.run($CMD, ..., shell=True, ...)"
          - pattern: "subprocess.call($CMD, ..., shell=True, ...)"
          - pattern: "subprocess.check_call($CMD, ..., shell=True, ...)"
          - pattern: "subprocess.check_output($CMD, ..., shell=True, ...)"
    pattern-not:
      - pattern: 'subprocess.Popen("...", ..., shell=True, ...)'
      - pattern: 'subprocess.run("...", ..., shell=True, ...)'
      - pattern: 'subprocess.call("...", ..., shell=True, ...)'
      - pattern: 'subprocess.check_call("...", ..., shell=True, ...)'
      - pattern: 'subprocess.check_output("...", ..., shell=True, ...)'
    message: >-
      Found `subprocess` call with `shell=True` using dynamic command `$CMD`.
      This is vulnerable to shell injection if `$CMD` contains untrusted user input.
      Pass arguments as a list with `shell=False` (e.g. `subprocess.run(["cmd", arg1, arg2])`).
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-78: Improper Neutralization of Special Elements used in an OS Command ('OS Command Injection')"
      confidence: HIGH
