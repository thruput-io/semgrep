rules:
  - id: python-no-nullable-parameters
    patterns:
      - pattern-either:
          - pattern: "def $FUNC(..., $PARAM: $T | None, ...): ..."
          - pattern: "def $FUNC(..., $PARAM: None | $T, ...): ..."
          - pattern: "def $FUNC(..., $PARAM: Optional[$T], ...): ..."
          - pattern: "def $FUNC(..., $PARAM: Union[$T, None], ...): ..."
          - pattern: "def $FUNC(..., $PARAM: Union[None, $T], ...): ..."
          - pattern: "def $FUNC(..., $PARAM: $T | None = $DEFAULT, ...): ..."
          - pattern: "def $FUNC(..., $PARAM: None | $T = $DEFAULT, ...): ..."
          - pattern: "def $FUNC(..., $PARAM: Optional[$T] = $DEFAULT, ...): ..."
          - pattern: "def $FUNC(..., $PARAM: Union[$T, None] = $DEFAULT, ...): ..."
          - pattern: "def $FUNC(..., $PARAM: Union[None, $T] = $DEFAULT, ...): ..."
          - pattern: "def $FUNC(..., $PARAM = None, ...): ..."
          - pattern: "async def $FUNC(..., $PARAM: $T | None, ...): ..."
          - pattern: "async def $FUNC(..., $PARAM: None | $T, ...): ..."
          - pattern: "async def $FUNC(..., $PARAM: Optional[$T], ...): ..."
          - pattern: "async def $FUNC(..., $PARAM: Union[$T, None], ...): ..."
          - pattern: "async def $FUNC(..., $PARAM: Union[None, $T], ...): ..."
          - pattern: "async def $FUNC(..., $PARAM: $T | None = $DEFAULT, ...): ..."
          - pattern: "async def $FUNC(..., $PARAM: None | $T = $DEFAULT, ...): ..."
          - pattern: "async def $FUNC(..., $PARAM: Optional[$T] = $DEFAULT, ...): ..."
          - pattern: "async def $FUNC(..., $PARAM: Union[$T, None] = $DEFAULT, ...): ..."
          - pattern: "async def $FUNC(..., $PARAM: Union[None, $T] = $DEFAULT, ...): ..."
          - pattern: "async def $FUNC(..., $PARAM = None, ...): ..."
      - pattern-not: "def __init__(...): ..."
      - pattern-not: "async def __init__(...): ..."
      - pattern-not: |
          @override
          def $FUNC(...): ...
      - pattern-not: |
          @override(...)
          def $FUNC(...): ...
      - pattern-not: |
          @override
          async def $FUNC(...): ...
      - pattern-not: |
          @override(...)
          async def $FUNC(...): ...
      - pattern-not: |
          @typing.override
          def $FUNC(...): ...
      - pattern-not: |
          @typing.override(...)
          def $FUNC(...): ...
      - pattern-not: |
          @typing.override
          async def $FUNC(...): ...
      - pattern-not: |
          @typing.override(...)
          async def $FUNC(...): ...
      - pattern-not: |
          @typing_extensions.override
          def $FUNC(...): ...
      - pattern-not: |
          @typing_extensions.override(...)
          def $FUNC(...): ...
      - pattern-not: |
          @typing_extensions.override
          async def $FUNC(...): ...
      - pattern-not: |
          @typing_extensions.override(...)
          async def $FUNC(...): ...
      - pattern-not: |
          @overrides
          def $FUNC(...): ...
      - pattern-not: |
          @overrides(...)
          def $FUNC(...): ...
      - pattern-not: |
          @overrides
          async def $FUNC(...): ...
      - pattern-not: |
          @overrides(...)
          async def $FUNC(...): ...
      - pattern-not: |
          @overrides.overrides
          def $FUNC(...): ...
      - pattern-not: |
          @overrides.overrides(...)
          def $FUNC(...): ...
      - pattern-not: |
          @overrides.overrides
          async def $FUNC(...): ...
      - pattern-not: |
          @overrides.overrides(...)
          async def $FUNC(...): ...
    message: >-
      Function or method `$FUNC` accepts nullable parameter `$PARAM`.
      Per RULES.md Section 4 and Section 7, functions and methods must explicitly declare non-nullable required parameters or use dedicated domain models.
      Do not accept optional parameters with null/None types or defaults. Require explicit arguments, dedicated factory functions, or parameter objects.
    languages: [python]
    severity: ERROR
    metadata:
      category: domain-modeling
      confidence: HIGH
      references:
        - https://github.com/thruput-io/agents/blob/main/RULES.md#compile-time-optionality
        - https://github.com/thruput-io/agents/blob/main/RULES.md#no-strategy-fallback
