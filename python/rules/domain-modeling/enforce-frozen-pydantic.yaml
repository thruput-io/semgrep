rules:
  - id: python-enforce-frozen-pydantic
    patterns:
      - pattern-either:
          - pattern: |
              class $MODEL(BaseModel):
                  ...
          - pattern: |
              class $MODEL(pydantic.BaseModel):
                  ...
      - pattern-not: |
          class $MODEL(BaseModel):
              ...
              model_config = ConfigDict(..., frozen=True, ...)
              ...
      - pattern-not: |
          class $MODEL(pydantic.BaseModel):
              ...
              model_config = ConfigDict(..., frozen=True, ...)
              ...
      - pattern-not: |
          class $MODEL(BaseModel):
              ...
              model_config = pydantic.ConfigDict(..., frozen=True, ...)
              ...
      - pattern-not: |
          class $MODEL(pydantic.BaseModel):
              ...
              model_config = pydantic.ConfigDict(..., frozen=True, ...)
              ...
      - pattern-not: |
          class $MODEL(BaseModel):
              ...
              model_config = {"frozen": True, ...}
              ...
      - pattern-not: |
          class $MODEL(pydantic.BaseModel):
              ...
              model_config = {"frozen": True, ...}
              ...
      - pattern-not: |
          class $MODEL(BaseModel):
              ...
              class Config:
                  ...
                  frozen = True
                  ...
      - pattern-not: |
          class $MODEL(pydantic.BaseModel):
              ...
              class Config:
                  ...
                  frozen = True
                  ...
    message: >-
      Found Pydantic `BaseModel` definition without `frozen=True` configuration.
      Per RULES.md Section 4, domain models and value objects MUST be immutable.
      Add `model_config = ConfigDict(frozen=True)` or `class Config: frozen = True` to enforce immutability.
    languages: [python]
    severity: ERROR
    metadata:
      category: domain-modeling
      confidence: HIGH
      references:
        - https://github.com/thruput-io/agents/blob/main/RULES.md#immutability
