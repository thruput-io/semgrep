rules:
- id: python-enforce-frozen-pydantic
  patterns:
  - pattern-either:
    - pattern: "class $MODEL(BaseModel):\n    ...\n"
    - pattern: "class $MODEL(pydantic.BaseModel):\n    ...\n"
  - pattern-not: "class $MODEL(BaseModel):\n    ...\n    model_config = ConfigDict(..., frozen=True, ...)\n    ...\n"
  - pattern-not: "class $MODEL(pydantic.BaseModel):\n    ...\n    model_config = ConfigDict(..., frozen=True, ...)\n    ...\n"
  - pattern-not: "class $MODEL(BaseModel):\n    ...\n    model_config = pydantic.ConfigDict(..., frozen=True, ...)\n    ...\n"
  - pattern-not: "class $MODEL(pydantic.BaseModel):\n    ...\n    model_config = pydantic.ConfigDict(..., frozen=True, ...)\n\
      \    ...\n"
  - pattern-not: "class $MODEL(BaseModel):\n    ...\n    model_config = {\"frozen\": True, ...}\n    ...\n"
  - pattern-not: "class $MODEL(pydantic.BaseModel):\n    ...\n    model_config = {\"frozen\": True, ...}\n    ...\n"
  - pattern-not: "class $MODEL(BaseModel):\n    ...\n    class Config:\n        ...\n        frozen = True\n        ...\n"
  - pattern-not: "class $MODEL(pydantic.BaseModel):\n    ...\n    class Config:\n        ...\n        frozen = True\n    \
      \    ...\n"
  message: 'Found Pydantic `BaseModel` definition without `frozen=True` configuration. Per RULES.md Section 4, domain models
    and value objects MUST be immutable. Add `model_config = ConfigDict(frozen=True)` or `class Config: frozen = True` to
    enforce immutability.'
  languages:
  - python
  severity: ERROR
  metadata:
    category: domain-modeling
    confidence: HIGH
    references:
    - https://thruput.se/agents/#no-mutators
    rule: No mutators
    solutions:
    - 'SHOULD: Use every typing add-on the language offers to give every type one [[Validating path of creation]] and no other.'
    - 'SHOULD: Where code smells of [[Optionality]] and [[Primitive Obsession]], improve it first by introducing encapsulation:
      refactor to opaque types, and retire the tests that only guarded against values the types can no longer hold.'
