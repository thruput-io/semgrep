rules:
- id: python-enforce-frozen-dataclasses
  patterns:
  - pattern-either:
    - pattern: "@dataclass\nclass $CLASS:\n    ...\n"
    - pattern: "@dataclass(...)\nclass $CLASS:\n    ...\n"
  - pattern-not: "@dataclass(..., frozen=True, ...)\nclass $CLASS:\n    ...\n"
  message: Found mutable `@dataclass` definition for `$CLASS`. Per RULES.md Section 4, domain objects MUST be immutable; state
    changes must return new validated instances. Add `frozen=True` (e.g. `@dataclass(frozen=True)`).
  languages:
  - python
  severity: ERROR
  metadata:
    category: correctness
    confidence: HIGH
    references:
    - https://thruput.se/agents/#no-mutators
    rule: No mutators
    solutions:
    - 'SHOULD: Use every typing add-on the language offers to give every type one [[Validating path of creation]] and no other.'
    - 'SHOULD: Where code smells of [[Optionality]] and [[Primitive Obsession]], improve it first by introducing encapsulation:
      refactor to opaque types, and retire the tests that only guarded against values the types can no longer hold.'
