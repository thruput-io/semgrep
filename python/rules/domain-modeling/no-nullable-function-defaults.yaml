rules:
  - id: python-no-nullable-function-defaults
    patterns:
      - pattern-either:
          - pattern: "def $FUNC(..., $PARAM = None, ...): ..."
          - pattern: "async def $FUNC(..., $PARAM = None, ...): ..."
      - pattern-not: "def __init__(...): ..."
      - pattern-not: "async def __init__(...): ..."
      - pattern-not: |
          @override
          def $FUNC(...): ...
      - pattern-not: |
          @override(...)
          def $FUNC(...): ...
      - pattern-not: |
          @override
          async def $FUNC(...): ...
      - pattern-not: |
          @override(...)
          async def $FUNC(...): ...
      - pattern-not: |
          @typing.override
          def $FUNC(...): ...
      - pattern-not: |
          @typing.override(...)
          def $FUNC(...): ...
      - pattern-not: |
          @typing.override
          async def $FUNC(...): ...
      - pattern-not: |
          @typing.override(...)
          async def $FUNC(...): ...
      - pattern-not: |
          @typing_extensions.override
          def $FUNC(...): ...
      - pattern-not: |
          @typing_extensions.override(...)
          def $FUNC(...): ...
      - pattern-not: |
          @typing_extensions.override
          async def $FUNC(...): ...
      - pattern-not: |
          @typing_extensions.override(...)
          async def $FUNC(...): ...
      - pattern-not: |
          @overrides
          def $FUNC(...): ...
      - pattern-not: |
          @overrides(...)
          def $FUNC(...): ...
      - pattern-not: |
          @overrides
          async def $FUNC(...): ...
      - pattern-not: |
          @overrides(...)
          async def $FUNC(...): ...
      - pattern-not: |
          @overrides.overrides
          def $FUNC(...): ...
      - pattern-not: |
          @overrides.overrides(...)
          def $FUNC(...): ...
      - pattern-not: |
          @overrides.overrides
          async def $FUNC(...): ...
      - pattern-not: |
          @overrides.overrides(...)
          async def $FUNC(...): ...
    message: >-
      Function or method `$FUNC` accepts parameter `$PARAM` with default `None`.
      Per RULES.md Section 4 and Section 7, functions and methods must explicitly declare required parameters or use dedicated domain models.
      Do not accept optional parameters with silent `None` defaults. Require explicit arguments, dedicated factory functions, or parameter objects.
    languages: [python]
    severity: ERROR
    metadata:
      category: domain-modeling
      confidence: HIGH
      references:
        - https://github.com/thruput-io/agents/blob/main/RULES.md#compile-time-optionality
        - https://github.com/thruput-io/agents/blob/main/RULES.md#no-strategy-fallback
