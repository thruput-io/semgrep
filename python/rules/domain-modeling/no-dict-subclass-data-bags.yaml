rules:
- id: python-no-dict-subclass-data-bags
  patterns:
  - pattern-either:
    - pattern: "class $NAME(dict):\n    ...\n"
    - pattern: "class $NAME(dict[...]):\n    ...\n"
    - pattern: "class $NAME(Dict):\n    ...\n"
    - pattern: "class $NAME(Dict[...]):\n    ...\n"
    - pattern: "class $NAME(typing.Dict):\n    ...\n"
    - pattern: "class $NAME(typing.Dict[...]):\n    ...\n"
    - pattern: "class $NAME(UserDict):\n    ...\n"
    - pattern: "class $NAME(collections.UserDict):\n    ...\n"
    - pattern: "class $NAME(MutableMapping[...]):\n    ...\n"
  message: Class `$NAME` subclasses `dict`, `Dict`, or `UserDict` as a dynamic data bag. Per RULES.md Section 4, ban raw maps/dictionaries
    and unstructured data bags for domain concepts. Define dedicated strongly-typed immutable domain models with explicit
    validated fields (e.g. `@dataclass(frozen=True)` or frozen Pydantic model).
  languages:
  - python
  severity: ERROR
  metadata:
    category: domain-modeling
    confidence: HIGH
    references:
    - https://thruput.se/agents/#strong-typing
    rule: Strong typing
    solutions:
    - 'SHOULD: Use every typing add-on the language offers to give every type one [[Validating path of creation]] and no other.'
    - 'SHOULD: Hide a type''s representation outside its defining module, as a new type or a branded type, rather than share
      it through an alias, so values that share a representation but not a meaning cannot be mixed.'
