rules:
- id: python-ban-any-in-domain-signatures
  patterns:
  - pattern-not-regex: '^[ \t]*def\s+__(?:eq|ne)__\s*\(\s*self\s*,\s*[A-Za-z0-9_]+\s*:\s*object\s*\)\s*->\s*bool\s*:'
  - pattern-either:
    - pattern-regex: def\s+[A-Za-z0-9_]+\s*\([^)]*?:\s*[^)=]*?\b(?:Any|object|dict|Dict)\b
    - pattern-regex: def\s+[A-Za-z0-9_]+\s*\([^)]*\)\s*->\s*[^:\n]*?\b(?:Any|object|dict|Dict)\b
  message: Found `Any`, `object`, or unstructured dictionary type annotation in function signature. Per RULES.md Section 4,
    ban dynamic, untyped, or unstructured types (`Any`, `object`, raw maps/dictionaries) in domain logic. Use validated Domain
    Primitives, Value Objects, typed models, or generic type variables instead.
  languages:
  - python
  severity: ERROR
  metadata:
    category: domain-modeling
    confidence: HIGH
    references:
    - https://thruput.se/agents/#strong-typing
    rule: Strong typing
    solutions:
    - 'SHOULD: Use every typing add-on the language offers to give every type one [[Validating path of creation]] and no other.'
    - 'SHOULD: Where code smells of [[Optionality]] and [[Primitive Obsession]], improve it first by introducing encapsulation:
      refactor to opaque types, and retire the tests that only guarded against values the types can no longer hold.'
