rules:
  - id: python-avoid-passing-none-literal
    patterns:
      - pattern-either:
          - pattern: $FUNC(..., None, ...)
          - pattern: $FUNC(..., $KEY=None, ...)
      - metavariable-regex:
          metavariable: $FUNC
          regex: '^(?!.*(assert)).*$'
    message: >-
      Passing literal `None` as an argument to `$FUNC`.
      In Clean Code, avoid passing `None` as arguments.
      Rely on default argument values in function definitions (omit the argument at call site, e.g. use `.get("key")` instead of `.get("key", None)`),
      or use dedicated, intention-revealing function overloads.
    languages: [python]
    severity: ERROR
    metadata:
      category: correctness
      confidence: HIGH
      references:
        - https://peps.python.org/pep-0008/#programming-recommendations
