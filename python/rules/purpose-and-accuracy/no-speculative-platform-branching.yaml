rules:
- id: python-no-speculative-platform-branching
  patterns:
  - pattern-either:
    - pattern: sys.platform == $VAL
    - pattern: sys.platform.startswith($VAL)
    - pattern: platform.system() == $VAL
    - pattern: os.name == 'nt'
    - pattern: os.name == 'posix'
  message: Found runtime OS / platform branching check. Per RULES.md Section 1, code MUST NOT add platform, shell, or environment
    compatibility branches for environments the task does not run in. Target the designated runtime environment directly without
    speculative portability branching.
  languages:
  - python
  severity: ERROR
  metadata:
    category: purpose-and-accuracy
    confidence: HIGH
    references:
    - https://thruput.se/agents/#no-speculative-portability
    rule: No speculative portability
    solutions:
    - 'SHOULD: State the [[User]] need before the change is reviewed, so every part of the change can be traced to it.'
    - 'SHOULD: Choose the technology the team already operates before adopting a new one.'
