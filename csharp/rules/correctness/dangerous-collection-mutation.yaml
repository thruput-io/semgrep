rules:
  - id: csharp-dangerous-collection-mutation
    patterns:
      - pattern-either:
          - pattern: |
              foreach (var $ITEM in $COLL)
              {
                  ...
                  $COLL.Remove($ITEM);
                  ...
              }
          - pattern: |
              foreach (var $ITEM in $COLL)
              {
                  ...
                  $COLL.Add($VAL);
                  ...
              }
          - pattern: |
              foreach (var $ITEM in $COLL)
              {
                  ...
                  $COLL.Clear();
                  ...
              }
    message: >-
      Mutating `$COLL` inside a `foreach` loop over `$COLL` will throw `InvalidOperationException: Collection was modified; enumeration operation may not execute`.
      Iterate over a snapshot copy (e.g. `foreach (var item in $COLL.ToList())`) or use `.RemoveAll(...)`.
    languages: [csharp]
    severity: ERROR
    metadata:
      category: correctness
      confidence: HIGH
