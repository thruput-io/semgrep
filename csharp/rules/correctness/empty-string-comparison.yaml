rules:
  - id: csharp-empty-string-comparison
    patterns:
      - pattern-either:
          - pattern: '$S == ""'
          - pattern: '$S != ""'
          - pattern: '"" == $S'
          - pattern: '"" != $S'
    message: >-
      Direct comparison `$S == ""` does not check for `null` or whitespace strings.
      Use `string.IsNullOrEmpty($S)` or `string.IsNullOrWhiteSpace($S)` to safely check for empty/missing string values.
    languages: [csharp]
    severity: ERROR
    metadata:
      category: correctness
      confidence: HIGH
      references:
        - https://learn.microsoft.com/en-us/dotnet/api/system.string.isnullorempty
