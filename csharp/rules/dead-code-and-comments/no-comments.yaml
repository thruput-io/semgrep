rules:
  - id: csharp-no-comments
    patterns:
      - pattern-either:
          - pattern-regex: '^[ \t]*\/\/(?!([ \t]*(?:<auto-generated|ReSharper|ruleid:|ok:|semgrep:|\/)))[ \t]*\S.+$'
          - pattern-regex: '\/\*(?!([ \t]*(?:ruleid:|ok:|semgrep:)))[\s\S]*?\*\/'
    message: >-
      Comments are disallowed in this codebase. Code should be self-documenting through clear naming,
      concise function structure, and type annotations.
    languages: [csharp]
    severity: ERROR
    metadata:
      category: dead-code-and-comments
      confidence: HIGH
      references:
        - https://github.com/thruput-io/agents/blob/main/RULES.md#no-comments-in-code
