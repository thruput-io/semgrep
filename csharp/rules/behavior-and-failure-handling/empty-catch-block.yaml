rules:
- id: csharp-empty-catch-block
  patterns:
  - pattern-either:
    - pattern: "try\n{\n    ...\n}\ncatch ($TYPE $EX)\n{\n}\n"
    - pattern: "try\n{\n    ...\n}\ncatch ($TYPE)\n{\n}\n"
    - pattern: "try\n{\n    ...\n}\ncatch\n{\n}\n"
  message: Found empty `catch` block that swallows exceptions silently. Per RULES.md Section 7, code MUST fail fast and MUST
    NOT use try/catch blocks that do not rethrow. Either let the exception bubble up or translate it into a specific Domain
    Exception.
  languages:
  - csharp
  severity: ERROR
  metadata:
    category: behavior-and-failure-handling
    confidence: HIGH
    references:
    - https://thruput.se/agents/#no-silent-catch
    rule: No silent catch
    solutions:
    - 'SHOULD: Make processes safe to kill at any moment, so a crash costs nothing but a restart ([The Twelve-Factor App,
      IX. Disposability](https://12factor.net/disposability)).'
    - 'SHOULD: Leave recovery to a supervisor outside the failing process.'
