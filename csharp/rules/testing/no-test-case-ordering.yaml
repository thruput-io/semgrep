rules:
  - id: csharp-no-test-case-ordering
    patterns:
      - pattern-regex: '\[\s*(?:(?:Xunit\.|NUnit\.Framework\.|Microsoft\.VisualStudio\.TestTools\.UnitTesting\.)?(?:TestCaseOrderer|TestPriority|Order|Priority))\s*\('
    message: >-
      Found test ordering attribute (`[TestCaseOrderer]`, `[TestPriority]`, `[Order]`).
      Per RULES.md Section 8, test cases MUST NOT be coupled or depend on execution order.
      Every test case MUST be executable independently in any order.
    languages: [csharp]
    severity: ERROR
    metadata:
      category: testing
      confidence: HIGH
      references:
        - https://github.com/thruput-io/agents/blob/main/RULES.md#no-test-case-coupling
