rules:
- id: csharp-no-branching-or-loops-in-tests
  patterns:
  - pattern-either:
    - pattern: "if ($COND)\n{\n    ...\n}\n"
    - pattern: "for ($TYPE $I = $INIT; $COND; $INCR)\n{\n    ...\n}\n"
    - pattern: "for ($I = $INIT; $COND; $INCR)\n{\n    ...\n}\n"
    - pattern: "foreach (var $ITEM in $SEQ)\n{\n    ...\n}\n"
    - pattern: "foreach ($TYPE $ITEM in $SEQ)\n{\n    ...\n}\n"
    - pattern: "while ($COND)\n{\n    ...\n}\n"
    - pattern: "switch ($EXPR)\n{\n    case $VAL:\n        ...\n}\n"
  - pattern-inside: "[$ATTR]\npublic void $TEST(...)\n{\n    ...\n}\n"
  - metavariable-regex:
      metavariable: $ATTR
      regex: ^(Fact|Theory|Test|TestMethod|FactAttribute|TheoryAttribute|TestAttribute).*$
  message: Found branching or loop statement inside test method `$TEST`. Per RULES.md Section 8, tests MUST be linear and
    deterministic. Tests MUST NOT contain branching logic (`if`, `switch`), fallback branches, or loops. Split conditional
    scenarios into separate parameterized unit tests (`[Theory]` / `[InlineData]`).
  languages:
  - csharp
  severity: ERROR
  metadata:
    category: testing
    confidence: HIGH
    references:
    - https://thruput.se/agents/#linear-deterministic-code
    rule: Linear deterministic code
    solutions:
    - 'SHOULD: Make processes safe to kill at any moment, so a crash costs nothing but a restart ([The Twelve-Factor App,
      IX. Disposability](https://12factor.net/disposability)).'
    - 'SHOULD: Leave recovery to a supervisor outside the failing process.'
