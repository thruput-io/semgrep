rules:
  - id: csharp-no-comments
    patterns:
      - pattern-either:
          - pattern-regex: '^[ \t]*\/\/(?!(?:\/|<auto-generated|ReSharper|ruleid:|ok:|semgrep:)).+$'
          - pattern-regex: '\/\*[\s\S]*?\*\/'
    message: >-
      Comments are disallowed in this codebase. Code should be self-documenting through clear naming,
      concise function structure, and type annotations.
    languages: [csharp]
    severity: WARNING
    metadata:
      category: style
      confidence: HIGH
