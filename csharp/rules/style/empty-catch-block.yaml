rules:
  - id: csharp-empty-catch-block
    patterns:
      - pattern-either:
          - pattern: |
              try
              {
                  ...
              }
              catch ($EX)
              {
              }
          - pattern: |
              try
              {
                  ...
              }
              catch
              {
              }
    message: >-
      Found empty `catch` block that swallows exceptions silently.
      Silently swallowing exceptions hides unexpected failures and makes debugging difficult.
      Log the exception, handle it appropriately, or add a comment explaining why ignoring it is safe.
    languages: [csharp]
    severity: WARNING
    metadata:
      category: style
      confidence: HIGH
