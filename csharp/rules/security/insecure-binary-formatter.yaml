rules:
  - id: csharp-insecure-binary-formatter
    patterns:
      - pattern-either:
          - pattern: "(BinaryFormatter $F).Deserialize(...)"
          - pattern: "new BinaryFormatter().Deserialize(...)"
          - pattern: "$FORMATTER.Deserialize($STREAM)"
      - pattern-not: "JsonSerializer.Deserialize(...)"
      - pattern-not: "JsonSerializer.Deserialize<$T>(...)"
      - pattern-not: "XmlSerializer.Deserialize(...)"
    message: >-
      Use of `BinaryFormatter.Deserialize` is inherently dangerous and cannot be made secure.
      Deserialization of untrusted data with `BinaryFormatter` allows arbitrary remote code execution and is deprecated/disabled in modern .NET.
      Use secure serializers like `System.Text.Json`, `XmlSerializer`, or `DataContractSerializer` with a known type whitelist.
    languages: [csharp]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-502: Deserialization of Untrusted Data"
      confidence: HIGH
      references:
        - https://learn.microsoft.com/en-us/dotnet/standard/serialization/binaryformatter-security-guide
