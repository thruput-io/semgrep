rules:
- id: csharp-no-suppress-message-attribute
  patterns:
  - pattern-regex: \[\s*(?:System\.Diagnostics\.CodeAnalysis\.)?SuppressMessage\s*\(
  message: Found `[SuppressMessage]` attribute bypassing static analysis or compiler warnings. Per RULES.md Section 9, do
    NOT disable linting, compiler, or analyzer rules via attributes or pragmas. Fix the underlying issue rather than suppressing
    the diagnostic.
  languages:
  - csharp
  severity: ERROR
  metadata:
    category: quality-tooling
    confidence: HIGH
    references:
    - https://thruput.se/agents/#no-local-disabling-of-lint-rules
    rule: No local disabling of lint rules
    solutions:
    - 'SHOULD: Resolve a [[Static code analysis]] warning at its root cause; where the code cannot satisfy a strict rule,
      seek architectural guidance, never a workaround.'
    - 'SHOULD: Enable the strictest static-analysis presets and compiler checks the ecosystem offers, so safeguards are enforced
      without review.'
