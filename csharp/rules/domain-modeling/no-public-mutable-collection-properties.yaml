rules:
- id: csharp-no-public-mutable-collection-properties
  patterns:
  - pattern-regex: public\s+(?:List|Dictionary|HashSet|Collection|IList|IDictionary|ISet)<[^>]+>\s+[A-Za-z0-9_]+\s*(?:\{|=>)
  message: Found public property exposing a mutable collection type (`List<T>`, `Dictionary<K, V>`, `HashSet<T>`). Per RULES.md
    Section 4, domain aggregates MUST NOT expose raw mutable collections. Expose `IReadOnlyList<T>`, `IReadOnlyDictionary<K,
    V>`, `IReadOnlyCollection<T>`, or `ImmutableArray<T>` instead.
  languages:
  - csharp
  severity: ERROR
  metadata:
    category: domain-modeling
    confidence: HIGH
    references:
    - https://thruput.se/agents/#self-guarding-aggregates
    rule: Self-guarding aggregates
    solutions:
    - 'SHOULD: Use every typing add-on the language offers to give every type one [[Validating path of creation]] and no other.'
    - 'SHOULD: Enforce a collection''s invariants in its type: a non-empty list makes `head` and `max` total, and a first-class
      collection enforces uniqueness, bounds, and ordering in one place.'
