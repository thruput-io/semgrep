rules:
  - id: csharp-no-unwrap-domain-value
    patterns:
      - pattern: "$X.Value"
      # Exclude inside domain object internal methods (encapsulation)
      - pattern-not-inside: |
          public override bool Equals(...) { ... }
      - pattern-not-inside: |
          public bool Equals(...) { ... }
      - pattern-not-inside: |
          public override int GetHashCode(...) { ... }
      - pattern-not-inside: |
          public override string ToString(...) { ... }
      # Exclude foreach loops over key-value pairs / dictionaries
      - pattern-not-inside: |
          foreach (var $KVP in $DICT) { ... }
      - pattern-not-inside: |
          foreach (KeyValuePair<$K, $V> $KVP in $DICT) { ... }
      # Exclude variables assigned from Regex/Match/Claim
      - pattern-not-inside: |
          var $X = $R.Match(...);
          ...
      - pattern-not-inside: |
          var $X = $U.FindFirst(...);
          ...
      - pattern-not-inside: |
          var $X = $U.FindFirstValue(...);
          ...
      - pattern-not-inside: |
          var $X = $U.FindAll(...);
          ...
      # Exclude persistence/serialization boundaries (JsonConverter, EF Core)
      - pattern-not-inside: |
          class $CONVERTER : JsonConverter<$T> { ... }
      - pattern-not-inside: |
          $B.HasConversion(...)
      # Exclude internal self-reference inside the type
      - pattern-not: "this.Value"
      # Exclude LINQ dictionary element access
      - pattern-not: "$DICT.FirstOrDefault(...).Value"
      - pattern-not: "$DICT.FirstOrDefault(...)?.Value"
      - pattern-not: "$DICT.First(...).Value"
      - pattern-not: "$DICT.SingleOrDefault(...).Value"
      - pattern-not: "$DICT.Single(...).Value"
      - pattern-not: "$DICT.ElementAt(...).Value"
      # Method calls returning framework types with .Value
      - pattern-not: "$U.FindFirst(...).Value"
      - pattern-not: "$U.FindFirst(...)?.Value"
      - pattern-not: "$REGEX.Match(...).Value"
      - pattern-not: "$MATCH.Groups[...].Value"
      - pattern-not: "$MATCH.Groups(...).Value"
      - pattern-not: "$GRP.Captures[...].Value"
      - pattern-not: "$GRP.Captures(...).Value"
      # Typed framework primitives that legitimately use .Value
      - pattern-not: "(IOptions<$T> $X).Value"
      - pattern-not: "(IOptionsSnapshot<$T> $X).Value"
      - pattern-not: "(IOptionsMonitor<$T> $X).Value"
      - pattern-not: "(Lazy<$T> $X).Value"
      - pattern-not: "(Claim $X).Value"
      - pattern-not: "(Claim? $X).Value"
      - pattern-not: "(Match $X).Value"
      - pattern-not: "(Match? $X).Value"
      - pattern-not: "(Group $X).Value"
      - pattern-not: "(Group? $X).Value"
      - pattern-not: "(Capture $X).Value"
      - pattern-not: "(Capture? $X).Value"
      - pattern-not: "(KeyValuePair<$K, $V> $X).Value"
      - pattern-not: "(Nullable<$T> $X).Value"
      - pattern-not: "($T? $X).Value"
      - pattern-not: "(AsyncLocal<$T> $X).Value"
      - pattern-not: "(ThreadLocal<$T> $X).Value"
      - pattern-not: "(XElement $X).Value"
      - pattern-not: "(XAttribute $X).Value"
      # Casts to framework primitives
      - pattern-not: "((Claim)$X).Value"
      - pattern-not: "((KeyValuePair<$K, $V>)$X).Value"
      - pattern-not: "((Match)$X).Value"
      - pattern-not: "((Group)$X).Value"
      - pattern-not: "((Capture)$X).Value"
    message: >-
      Do not unwrap domain value objects using `.Value`. Pass the strongly-typed
      domain object directly or encapsulate domain behavior within the type.
    languages: [csharp]
    severity: ERROR
    metadata:
      category: domain-modeling
      confidence: HIGH
      references:
        - https://github.com/thruput-io/agents/blob/main/RULES.md#no-unwrapping
        - https://github.com/thruput-io/agents/blob/main/RULES.md#domain-operations
