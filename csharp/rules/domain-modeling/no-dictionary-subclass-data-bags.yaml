rules:
- id: csharp-no-dictionary-subclass-data-bags
  patterns:
  - pattern-regex: public\s+(?:sealed\s+)?class\s+[A-Za-z0-9_]+\s*:\s*(?:(?:System\.Collections\.Generic\.)?Dictionary<|(?:System\.Collections\.Concurrent\.)?ConcurrentDictionary<)
  message: Class inherits directly from `Dictionary<...>` or `ConcurrentDictionary<...>` as a generic data bag. Per RULES.md
    Section 4, ban raw maps/dictionaries and unstructured data bags for domain concepts. Define dedicated strongly-typed immutable
    domain records or classes with explicit validated properties.
  languages:
  - csharp
  severity: ERROR
  metadata:
    category: domain-modeling
    confidence: HIGH
    references:
    - https://thruput.se/agents/#strong-typing
    rule: Strong typing
    solutions:
    - 'SHOULD: Use every typing add-on the language offers to give every type one [[Validating path of creation]] and no other.'
    - 'SHOULD: Hide a type''s representation outside its defining module, as a new type or a branded type, rather than share
      it through an alias, so values that share a representation but not a meaning cannot be mixed.'
