rules:
- id: csharp-no-nullable-constructor-defaults
  patterns:
  - pattern-regex: public\s+[A-Za-z0-9_]+\s*\([^)]*?(?:[A-Za-z0-9_?<>\[\],\s]+)\s+[A-Za-z0-9_]+\s*=\s*(?:null|default)
  message: Constructor accepts parameter with default `null` or `default`. Per RULES.md Section 4 and Section 7, dependencies
    and domain invariants must be explicitly provided. Do not accept optional dependencies with silent null defaults. Require
    explicit dependencies or use dedicated factory overloads.
  languages:
  - csharp
  severity: ERROR
  metadata:
    category: domain-modeling
    confidence: HIGH
    references:
    - https://thruput.se/agents/#no-optionality
    rule: No optionality
    solutions:
    - 'SHOULD: Make the toggle a strategy so that it encodes all options it controls'
    - 'SHOULD: Make overload or specific behaviour [[Explicitly named method]]s instead of optional flags'
