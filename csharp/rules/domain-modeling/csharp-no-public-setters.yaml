rules:
- id: csharp-no-public-setters
  patterns:
  - pattern-regex: public\s+[A-Za-z0-9_<>?,.\[\]\s]+\s+[A-Za-z0-9_]+\s*\{\s*(get\s*;\s*set\s*;|set\s*;\s*get\s*;)\s*\}
  message: Found raw public setter on property. Per RULES.md Section 4, domain objects MUST be immutable; state changes must
    return new validated instances. Use `{ get; init; }` or `{ get; private set; }` instead of raw public setters.
  languages:
  - csharp
  severity: ERROR
  metadata:
    category: domain-modeling
    confidence: HIGH
    references:
    - https://thruput.se/agents/#no-mutators
    rule: No mutators
    solutions:
    - 'SHOULD: Use every typing add-on the language offers to give every type one [[Validating path of creation]] and no other.'
    - 'SHOULD: Where code smells of [[Optionality]] and [[Primitive Obsession]], improve it first by introducing encapsulation:
      refactor to opaque types, and retire the tests that only guarded against values the types can no longer hold.'
