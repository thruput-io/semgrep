rules:
  - id: csharp-no-public-setters
    patterns:
      - pattern-regex: 'public\s+[A-Za-z0-9_<>?,.\[\]\s]+\s+[A-Za-z0-9_]+\s*\{\s*(get\s*;\s*set\s*;|set\s*;\s*get\s*;)\s*\}'
    message: >-
      Found raw public setter on property.
      Per RULES.md Section 4, domain objects MUST be immutable; state changes must return new validated instances.
      Use `{ get; init; }` or `{ get; private set; }` instead of raw public setters.
    languages: [csharp]
    severity: ERROR
    metadata:
      category: domain-modeling
      confidence: HIGH
      references:
        - https://github.com/thruput-io/agents/blob/main/RULES.md#immutability
        - https://github.com/thruput-io/agents/blob/main/RULES.md#self-guarding-aggregates
