rules:
  - id: linear-deterministic-code
    message: "Do not write tests that contain conditional branching or loops. Test scripts and bats @test bodies must be linear and deterministic."
    severity: ERROR
    languages:
      - bash
    paths:
      include:
        - "*.bats"
        - "test-*.sh"
        - "*_test.sh"
        - "test_*.sh"
        - "**/test/**"
        - "**/tests/**"
        - "**/testing/**"
    pattern-either:
      - pattern: |
          if ...; then
            ...
          fi
      - pattern: |
          for $VAR in ...; do
            ...
          done
      - pattern: |
          while ...; do
            ...
          done
      - pattern: until ...
      - pattern: |
          case $VAL in
            $PAT) ...
            ;;
          esac
    metadata:
      category: testing
      technology:
        - bash
        - bats
      references:
        - https://github.com/thruput-io/agents/blob/main/rules.yaml#linear-deterministic-code
