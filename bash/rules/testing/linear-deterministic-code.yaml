rules:
  - id: linear-deterministic-code
    message: "Do not write tests that contain branching logic (if, for, while, case). A bats @test body must be linear and deterministic."
    severity: ERROR
    languages:
      - generic
    paths:
      include:
        - "*.bats"
    patterns:
      - pattern-regex: |
          (?sm)@test\s+"[^"]*"\s*\{(?:'[^']*'|"(?:[^"\\]|\\.)*"|<<-?\s*['"]?(\w+)['"]?[^\n]*\n[\s\S]*?\n\s*\1|#[^\n]*\n|(?!\n\})(?:(?!<<)[^'"#]))*?(?:^|\n|;|&&|\|\||\||\{|\bthen\b|\bdo\b)\s*\b(if|for|while|case)\b(?:(?!\n\})[\s\S])*?\n\}
    metadata:
      category: testing
      technology:
        - bash
        - bats
      references:
        - https://github.com/thruput-io/agents/blob/main/rules.yaml#linear-deterministic-code
