rules:
  - id: linear-deterministic-code
    message: "Do not write tests that contain branching or loop logic (if, for, while, until, case). Test scripts and bats @test bodies must be linear and deterministic."
    severity: ERROR
    languages:
      - generic
    paths:
      include:
        - "*.bats"
        - "test-*.sh"
        - "*_test.sh"
        - "test_*.sh"
        - "**/test/**"
        - "**/tests/**"
    patterns:
      - pattern-either:
          - pattern-regex: |
              (?sm)@test\s+"[^"]*"\s*\{(?:'[^']*'|"(?:[^"\\]|\\.)*"|<<-?\s*['"]?(\w+)['"]?[^\n]*\n[\s\S]*?\n\s*\1|#[^\n]*\n|(?!\n\})(?:(?!<<)[^'"#]))*?(?:^|\n|;|&&|\|\||\||\{|\bthen\b|\bdo\b)\s*\b(if|for|while|until|case)\b(?:(?!\n\})[\s\S])*?\n\}
          - patterns:
              - pattern-regex: '(?m)^\s*(?:if|for|while|until|case)\s+'
              - pattern-not-regex: '(?sm)@test\s+"[^"]*"\s*\{[\s\S]*?\n\}'
    metadata:
      category: testing
      technology:
        - bash
        - bats
      references:
        - https://github.com/thruput-io/agents/blob/main/rules.yaml#linear-deterministic-code
