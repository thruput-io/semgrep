rules:
- id: require-shebang
  message: 'Executable shell scripts MUST start with a valid shebang (e.g. #!/bin/bash or #!/usr/bin/env bash). A sourced
    file lives under a lib/ folder instead, with no shebang.'
  severity: ERROR
  languages:
  - bash
  paths:
    exclude:
    - '**/lib/**'
  patterns:
  - pattern-regex: \A(?!#!)
  metadata:
    category: purpose-and-accuracy
    technology:
    - bash
    rule: Scripts abort on error
    solutions:
    - 'SHOULD: Make processes safe to kill at any moment, so a crash costs nothing but a restart ([The Twelve-Factor App,
      IX. Disposability](https://12factor.net/disposability)).'
    - 'SHOULD: Leave recovery to a supervisor outside the failing process.'
    references:
    - https://thruput.se/agents/#scripts-abort-on-error
