rules:
- id: no-speculative-portability
  message: Do not add platform, shell, or environment compatibility branches for environments the task does not run in. Target
    the designated runtime directly.
  severity: ERROR
  languages:
  - bash
  patterns:
  - pattern-regex: (\$OSTYPE"?\s*(==|!=|=)|"\$\(uname[^)]*\)"\s*(==|!=|=)|case\s+"?\$\(uname)
  metadata:
    category: purpose-and-accuracy
    technology:
    - bash
    references:
    - https://thruput.se/agents/#no-speculative-portability
    rule: No speculative portability
    solutions:
    - 'SHOULD: State the [[User]] need before the change is reviewed, so every part of the change can be traced to it.'
    - 'SHOULD: Choose the technology the team already operates before adopting a new one.'
