rules:
- id: no-suppressed-exit-status
  message: Do not discard or suppress a command's non-zero exit status in an '||' fallback. Let failing commands abort or
    return a non-zero status.
  severity: ERROR
  languages:
  - bash
  pattern-either:
  - pattern: $CMD ... || true
  - pattern: '$CMD ... || :'
  - pattern: $CMD ... || return 0
  - pattern: $CMD ... || exit 0
  - pattern: "$CMD ... || {\n  ...\n  return 0\n}\n"
  - pattern: "$CMD ... || {\n  ...\n  exit 0\n}\n"
  metadata:
    category: behavior-and-failure-handling
    technology:
    - bash
    references:
    - https://thruput.se/agents/#no-suppressed-exit-status
    rule: No suppressed exit status
    solutions:
    - 'SHOULD: Make processes safe to kill at any moment, so a crash costs nothing but a restart ([The Twelve-Factor App,
      IX. Disposability](https://12factor.net/disposability)).'
    - 'SHOULD: Leave recovery to a supervisor outside the failing process.'
