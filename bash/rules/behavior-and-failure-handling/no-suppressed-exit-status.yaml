rules:
  - id: no-suppressed-exit-status
    message: "Do not discard or suppress a command's non-zero exit status in an '||' fallback. Let failing commands abort or return a non-zero status."
    severity: ERROR
    languages:
      - bash
    pattern-either:
      - pattern: $CMD ... || true
      - pattern: "$CMD ... || :"
      - pattern: $CMD ... || return 0
      - pattern: $CMD ... || exit 0
      - pattern: |
          $CMD ... || {
            ...
            return 0
          }
      - pattern: |
          $CMD ... || {
            ...
            exit 0
          }
    metadata:
      category: behavior-and-failure-handling
      technology:
        - bash
      references:
        - https://github.com/thruput-io/agents/blob/main/rules.yaml#no-suppressed-exit-status
