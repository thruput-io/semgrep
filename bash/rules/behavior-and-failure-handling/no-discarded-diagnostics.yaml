rules:
  - id: no-discarded-diagnostics
    message: "Do not send a command's stderr to /dev/null (e.g., 2>/dev/null, 2>>/dev/null, >/dev/null 2>&1, or &>/dev/null); let the failing tool report its error."
    severity: ERROR
    languages:
      - bash
    patterns:
      - pattern-regex: '(2>>?\s*/dev/null|>\s*/dev/null\s+2>&1|&>>?\s*/dev/null)'
    metadata:
      category: behavior-and-failure-handling
      technology:
        - bash
      references:
        - https://github.com/thruput-io/agents/blob/main/rules.yaml#no-discarded-diagnostics
