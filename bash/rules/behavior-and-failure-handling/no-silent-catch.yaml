rules:
  - id: no-silent-catch
    message: "Do not clear a signal or error trap with an empty action; that silences failures instead of handling them."
    severity: ERROR
    languages:
      - bash
    pattern-either:
      - pattern: trap '' ...
      - pattern: trap "" ...
    metadata:
      category: behavior-and-failure-handling
      technology:
        - bash
      references:
        - https://github.com/thruput-io/agents/blob/main/rules.yaml#no-silent-catch
