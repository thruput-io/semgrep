rules:
  - id: no-default-on-failure
    message: "Do not return or use a default value when a command fails (VAR=$(cmd) || VAR=default, or $(cmd || echo default)). Fail fast instead of masking the failure."
    severity: ERROR
    languages:
      - bash
    patterns:
      - pattern-regex: '(\w+=\$\([^)]*\)\s*\|\|\s*\w+=|\$\([^)]*\|\|\s*(?:echo|printf)\b|\$\{[A-Za-z_][A-Za-z0-9_]*(?::-|:=)[^}]*\}|\blocal\s+[A-Za-z_][A-Za-z0-9_]*=["'']?\$\{[0-9]+(?::-|:=)[^}]*\})'
    metadata:
      category: behavior-and-failure-handling
      technology:
        - bash
      references:
        - https://github.com/thruput-io/agents/blob/main/rules.yaml#no-default-on-failure
