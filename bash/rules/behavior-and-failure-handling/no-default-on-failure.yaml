rules:
  - id: no-default-on-failure
    message: "Do not return or use a default value when a command fails or when a variable or parameter is unset or empty. Fail fast instead of masking missing inputs or failures."
    severity: ERROR
    languages:
      - bash
    pattern-either:
      - pattern: $VAR=$(...) || $VAR=$DEFAULT
      - pattern: $($CMD ... || echo ...)
      - pattern: $($CMD ... || printf ...)
      - pattern-regex: '\$\{[A-Za-z0-9_]+:[-=][^}]*\}'
    metadata:
      category: behavior-and-failure-handling
      technology:
        - bash
      references:
        - https://github.com/thruput-io/agents/blob/main/rules.yaml#no-default-on-failure
        - https://github.com/thruput-io/agents/blob/main/rules.yaml#no-optionality
