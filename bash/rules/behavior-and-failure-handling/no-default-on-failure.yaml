rules:
- id: no-default-on-failure
  message: Do not return or use a default value when a command fails or when a variable or parameter is unset or empty. Fail
    fast instead of masking missing inputs or failures.
  severity: ERROR
  languages:
  - bash
  pattern-either:
  - pattern: $VAR=$(...) || $VAR=$DEFAULT
  - pattern: $($CMD ... || echo ...)
  - pattern: $($CMD ... || printf ...)
  - pattern-regex: \$\{[A-Za-z0-9_]+:[-=][^}]*\}
  metadata:
    category: behavior-and-failure-handling
    technology:
    - bash
    references:
    - https://thruput.se/agents/#no-default-on-failure
    rule: No default on failure
    solutions:
    - 'SHOULD: Make processes safe to kill at any moment, so a crash costs nothing but a restart ([The Twelve-Factor App,
      IX. Disposability](https://12factor.net/disposability)).'
    - 'SHOULD: Leave recovery to a supervisor outside the failing process.'
